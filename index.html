<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <style>
    :root {
      --pomodoro: #e74c3c;
      --short-break: #27ae60;
      --long-break: #2980b9;
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --text: #eaeaea;
      --text-muted: #8892a4;
      --accent: #e94560;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    .app-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Mode tabs ── */
    .mode-tabs {
      display: flex;
      gap: 8px;
      background: var(--surface);
      padding: 6px;
      border-radius: 50px;
      margin-bottom: 32px;
    }

    .mode-tab {
      padding: 8px 20px;
      border: none;
      border-radius: 50px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-tab.active {
      background: var(--mode-color, var(--pomodoro));
      color: #fff;
    }

    /* ── Timer ── */
    .timer-card {
      background: var(--surface);
      border-radius: 24px;
      padding: 40px 60px;
      text-align: center;
      width: 100%;
      max-width: 420px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .timer-ring {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 28px;
    }

    .timer-ring svg {
      transform: rotate(-90deg);
    }

    .timer-ring .bg-circle {
      fill: none;
      stroke: var(--surface2);
      stroke-width: 8;
    }

    .timer-ring .progress-circle {
      fill: none;
      stroke: var(--mode-color, var(--pomodoro));
      stroke-width: 8;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }

    .timer-display {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .timer-time {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }

    .timer-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-top: 4px;
    }

    .timer-controls {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }

    .btn {
      border: none;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--mode-color, var(--pomodoro));
      color: #fff;
      padding: 14px 40px;
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .btn-primary:hover { filter: brightness(1.1); transform: scale(1.03); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-icon {
      background: var(--surface2);
      color: var(--text-muted);
      width: 44px;
      height: 44px;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .btn-icon:hover { background: var(--accent); color: #fff; }

    .history-open {
      width: 38px;
      height: 38px;
      font-size: 1rem;
    }

    /* ── Pomodoro counter ── */
    .pomodoro-counter {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .pom-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--surface2);
      transition: background 0.3s;
    }

    .pom-dot.done { background: var(--pomodoro); }
    .pom-dot.current { background: var(--mode-color, var(--pomodoro)); }

    /* ── Active task ── */
    .active-task-bar {
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 20px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }

    .active-task-bar .label { color: var(--text-muted); white-space: nowrap; }
    .active-task-bar .name { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Tasks panel ── */
    .tasks-panel {
      width: 100%;
      max-width: 420px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .add-task-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .add-task-form input {
      flex: 1;
      background: var(--surface);
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .add-task-form input:focus { border-color: var(--mode-color, var(--pomodoro)); }
    .add-task-form input::placeholder { color: var(--text-muted); }

    .btn-add {
      background: var(--mode-color, var(--pomodoro));
      color: #fff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 1.2rem;
      min-width: 44px;
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      background: var(--surface);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.2s, background 0.2s;
    }

    .task-item:hover { background: var(--surface2); }
    .task-item.selected { border-color: var(--mode-color, var(--pomodoro)); }
    .task-item.completed { opacity: 0.5; }

    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .task-check:hover { border-color: var(--mode-color, var(--pomodoro)); }
    .task-item.completed .task-check {
      background: var(--text-muted);
      border-color: var(--text-muted);
      color: var(--bg);
    }

    .task-info { flex: 1; min-width: 0; }
    .task-name { font-size: 0.92rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-item.completed .task-name { text-decoration: line-through; color: var(--text-muted); }

    .task-meta {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 3px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .task-poms { display: flex; gap: 3px; }
    .task-pom-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pomodoro); opacity: 0.7; }

    .task-delete, .task-edit {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      border-radius: 6px;
      opacity: 0;
      transition: opacity 0.2s, color 0.2s;
    }

    .task-item:hover .task-delete,
    .task-item:hover .task-edit { opacity: 1; }
    .task-delete:hover { color: var(--accent); }
    .task-edit:hover { color: var(--mode-color, var(--pomodoro)); }

    .task-name-input {
      width: 100%;
      background: var(--bg);
      border: 2px solid var(--mode-color, var(--pomodoro));
      border-radius: 8px;
      padding: 4px 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 500;
      outline: none;
    }

    /* ── Notification ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      color: var(--text);
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.9rem;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      transition: transform 0.3s ease;
      z-index: 100;
      white-space: nowrap;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Empty state ── */
    .empty-tasks {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 24px;
    }

    /* ── Stats summary ── */
    .stats-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .stat-pill {
      background: var(--surface);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .stat-pill strong { color: var(--text); }

    /* ── History overlay ── */
    .history-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(26, 26, 46, 0.98);
      padding: 24px 16px;
      overflow-y: auto;
      display: none;
    }

    .history-overlay.open { display: block; }

    .history-panel {
      width: min(560px, 100%);
      margin: 0 auto;
    }

    .history-header,
    .history-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .history-header { margin-bottom: 22px; }

    .history-title {
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }

    .history-month {
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: capitalize;
    }

    .history-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
      margin: 18px 0 20px;
    }

    .history-day-name {
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      text-align: center;
      text-transform: uppercase;
    }

    .history-day-spacer {
      aspect-ratio: 1;
      min-width: 0;
    }

    .history-day {
      aspect-ratio: 1;
      min-width: 0;
      border: 1px solid var(--surface2);
      border-radius: 8px;
      background: rgba(231, 76, 60, calc(0.18 + var(--intensity, 0) * 0.72));
      color: var(--text);
      cursor: pointer;
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      transition: border-color 0.2s, transform 0.15s;
    }

    .history-day.empty {
      background: var(--surface);
      color: var(--text-muted);
      opacity: 0.55;
    }

    .history-day.selected,
    .history-day:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .history-detail {
      border-top: 1px solid var(--surface2);
      padding-top: 16px;
    }

    .history-detail-title {
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .history-detail-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-detail-row {
      background: var(--surface);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
    }

    .history-detail-task {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .history-detail-meta {
      color: var(--text-muted);
      flex-shrink: 0;
      font-size: 0.82rem;
    }

    .history-detail-empty {
      color: var(--text-muted);
      font-size: 0.86rem;
      padding: 12px 0;
    }
  </style>
</head>
<body>

<header class="app-title">
  <h1>🍅 Pomodoro</h1>
  <button class="btn btn-icon history-open" id="btnHistory" title="Historial">▦</button>
</header>

<!-- Mode tabs -->
<div class="mode-tabs">
  <button class="mode-tab active" data-mode="pomodoro">Pomodoro</button>
  <button class="mode-tab" data-mode="short">Descanso corto</button>
  <button class="mode-tab" data-mode="long">Descanso largo</button>
</div>

<!-- Timer -->
<div class="timer-card">
  <div class="timer-ring">
    <svg width="200" height="200" viewBox="0 0 200 200">
      <circle class="bg-circle" cx="100" cy="100" r="90"/>
      <circle class="progress-circle" id="progressCircle" cx="100" cy="100" r="90"
        stroke-dasharray="565.49" stroke-dashoffset="0"/>
    </svg>
    <div class="timer-display">
      <div class="timer-time" id="timerDisplay">25:00</div>
      <div class="timer-label" id="timerLabel">Pomodoro</div>
    </div>
  </div>

  <div class="timer-controls">
    <button class="btn btn-icon" id="btnReset" title="Reiniciar">↺</button>
    <button class="btn btn-primary" id="btnStart" disabled>INICIAR</button>
    <button class="btn btn-icon" id="btnSkip" title="Saltar">⏭</button>
  </div>

  <div class="pomodoro-counter" id="pomodoroCounter"></div>
</div>

<!-- Active task bar -->
<div class="active-task-bar" id="activeTaskBar">
  <span class="label">Trabajando en:</span>
  <span class="name" id="activeTaskName">— Ninguna tarea seleccionada —</span>
</div>

<!-- Tasks panel -->
<div class="tasks-panel">
  <div class="panel-header">
    <span class="panel-title">Tareas</span>
    <div class="stats-row" id="statsRow"></div>
  </div>

  <div class="add-task-form">
    <input type="text" id="taskInput" placeholder="Añadir nueva tarea..." maxlength="80" />
    <button class="btn btn-add" id="btnAddTask">+</button>
  </div>

  <div class="task-list" id="taskList"></div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- History overlay -->
<div class="history-overlay" id="historyOverlay" aria-hidden="true">
  <div class="history-panel">
    <div class="history-header">
      <div class="history-title">Historial</div>
      <button class="btn btn-icon" id="btnCloseHistory" title="Cerrar">✕</button>
    </div>

    <div class="history-nav">
      <button class="btn btn-icon" id="btnPrevMonth" title="Mes anterior">←</button>
      <div class="history-month" id="historyMonthLabel"></div>
      <button class="btn btn-icon" id="btnNextMonth" title="Mes siguiente">→</button>
    </div>

    <div class="history-grid" id="historyGrid"></div>
    <div class="history-detail" id="historyDetail"></div>
  </div>
</div>

<script src='historial.js'></script>
<script>
// ── Constants ──
const DURATIONS = { pomodoro: 25 * 60, short: 5 * 60, long: 10 * 60 };
const MODE_LABELS = { pomodoro: 'Pomodoro', short: 'Descanso corto', long: 'Descanso largo' };
const MODE_COLORS = { pomodoro: '#e74c3c', short: '#27ae60', long: '#2980b9' };
const CIRCUMFERENCE = 2 * Math.PI * 90; // r=90

// ── State ──
let state = {
  mode: 'pomodoro',
  running: false,
  tasks: [],
  activeTaskId: null,
  editingTaskId: null,     // tarea que se está renombrando (no se persiste)
  // Wall-clock timer: startedAt + accumulatedSeconds define el tiempo real
  startedAt: null,         // Date.now() cuando se reanudó por última vez
  accumulatedSeconds: 0,   // segundos contados antes del último pause
};

let timerInterval = null;
let history = loadHistory();
let historyOverlayDate = new Date();
let selectedHistoryDay = null;

// ── Persistence ──
function save() {
  const toSave = {
    tasks: state.tasks,
    activeTaskId: state.activeTaskId,
  };
  localStorage.setItem('pomodoro_state', JSON.stringify(toSave));
}

function loadHistory() {
  try {
    const raw = localStorage.getItem('pomodoro_history');
    if (!raw) return [];
    const saved = JSON.parse(raw);
    return Array.isArray(saved) ? saved : [];
  } catch(e) {
    return [];
  }
}

function saveHistory(arr) {
  localStorage.setItem('pomodoro_history', JSON.stringify(arr));
}

function load() {
  try {
    const raw = localStorage.getItem('pomodoro_state');
    if (!raw) return;
    const saved = JSON.parse(raw);
    state.tasks = Array.isArray(saved.tasks)
      ? saved.tasks.map(({ timeSeconds, pomodoros, ...task }) => task)
      : [];
    state.activeTaskId = saved.activeTaskId || null;
  } catch(e) { /* ignore */ }
}

// ── Timer logic ──
// Retorna los segundos reales transcurridos en total (acumulados + sesión actual)
function elapsedSeconds() {
  if (!state.startedAt) return state.accumulatedSeconds;
  return state.accumulatedSeconds + Math.floor((Date.now() - state.startedAt) / 1000);
}

function secondsLeft() {
  return Math.max(0, DURATIONS[state.mode] - elapsedSeconds());
}

function startTimer() {
  if (state.running) return;
  if (state.activeTaskId === null) return;
  state.running = true;
  state.startedAt = Date.now();
  btnStart.textContent = 'PAUSAR';
  updateStartButtonAvailability();
  // Intervalo corto para que el display sea fluido; la precisión viene de Date.now()
  timerInterval = setInterval(tick, 250);
}

function pauseTimer() {
  if (!state.running) return;
  state.running = false;
  clearInterval(timerInterval);
  timerInterval = null;
  btnStart.textContent = 'CONTINUAR';
  updateStartButtonAvailability();
  // Congelar el tiempo acumulado
  const sessionElapsed = Math.floor((Date.now() - state.startedAt) / 1000);
  state.accumulatedSeconds += sessionElapsed;
  state.startedAt = null;
  updateUI();
}

function tick() {
  const left = secondsLeft();
  if (left <= 0) {
    clearInterval(timerInterval);
    timerInterval = null;
    state.running = false;
    updateUI();
    onTimerEnd();
    return;
  }
  updateUI();
}

function onTimerEnd() {
  if (state.mode === 'pomodoro') {
    if (state.activeTaskId === null) {
      resetTimer();
      renderTasks();
      renderCounter();
      return;
    }

    const completedAt = Date.now();
    history = Historial.addEntry(history, state.activeTaskId, completedAt, DURATIONS.pomodoro / 60);
    saveHistory(history);
    showToast('🍅 ¡Pomodoro completado!');
    playAlarm();
    // Auto-switch to break
    const nextMode = Historial.isLongBreak(history, Date.now()) ? 'long' : 'short';
    setTimeout(() => switchMode(nextMode), 800);
  } else {
    showToast('☕ Descanso terminado. ¡A trabajar!');
    playAlarm();
    setTimeout(() => switchMode('pomodoro'), 800);
  }

  renderTasks();
  renderCounter();
}

function resetTimer() {
  if (state.running) { clearInterval(timerInterval); timerInterval = null; state.running = false; }
  state.startedAt = null;
  state.accumulatedSeconds = 0;
  btnStart.textContent = 'INICIAR';
  updateStartButtonAvailability();
  updateUI();
}

function skipTimer() {
  if (state.running) { clearInterval(timerInterval); timerInterval = null; state.running = false; }
  const todayCount = Historial.todayCount(history, Date.now());
  const nextMode = state.mode === 'pomodoro'
    ? ((todayCount + 1) % 4 === 0 ? 'long' : 'short')
    : 'pomodoro';
  state.startedAt = null;
  state.accumulatedSeconds = 0;
  switchMode(nextMode);
}

function switchMode(mode) {
  if (state.running) { clearInterval(timerInterval); timerInterval = null; state.running = false; }
  state.mode = mode;
  state.startedAt = null;
  state.accumulatedSeconds = 0;
  btnStart.textContent = 'INICIAR';
  updateStartButtonAvailability();
  updateModeUI();
  updateUI();
}

function createTask(name) {
  return {
    id: Date.now().toString(),
    name: name.trim(),
    completed: false,
    createdAt: Date.now(),
  };
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return `${h}h ${m}m`;
  if (m > 0) return `${m}m ${s}s`;
  return `${s}s`;
}

// ── UI helpers ──
function updateUI() {
  const total = DURATIONS[state.mode];
  const left = secondsLeft();
  const elapsed = total - left;
  const progress = elapsed / total;
  const offset = CIRCUMFERENCE * (1 - progress);

  progressCircle.style.strokeDashoffset = offset;
  const m = Math.floor(left / 60).toString().padStart(2, '0');
  const s = (left % 60).toString().padStart(2, '0');
  timerDisplay.textContent = `${m}:${s}`;
  document.title = `${m}:${s} — ${MODE_LABELS[state.mode]}`;
}

function updateModeUI() {
  const color = MODE_COLORS[state.mode];
  document.documentElement.style.setProperty('--mode-color', color);
  timerLabel.textContent = MODE_LABELS[state.mode];
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === state.mode);
  });
}

function updateStartButtonAvailability() {
  btnStart.disabled = state.activeTaskId === null;
}

function renderCounter() {
  const todayCount = Historial.todayCount(history, Date.now());
  const cyclePosition = todayCount % 4;
  const dots = [];
  for (let i = 0; i < 4; i++) {
    if (i < cyclePosition) dots.push('<div class="pom-dot done"></div>');
    else if (i === cyclePosition && state.mode === 'pomodoro') dots.push('<div class="pom-dot current"></div>');
    else dots.push('<div class="pom-dot"></div>');
  }
  pomodoroCounter.innerHTML = dots.join('');
}

function renderTasks() {
  updateStartButtonAvailability();

  // Active task bar
  const active = state.tasks.find(t => t.id === state.activeTaskId);
  activeTaskName.textContent = active ? active.name : '— Ninguna tarea seleccionada —';

  // Stats
  const done = state.tasks.filter(t => t.completed).length;
  const todayCount = Historial.todayCount(history, Date.now());
  const todayTime = Historial.deriveTime(todayCount, DURATIONS.pomodoro / 60);
  statsRow.innerHTML = `
    <div class="stat-pill">✅ <strong>${done}/${state.tasks.length}</strong> tareas</div>
    <div class="stat-pill">🍅 <strong>${todayCount}</strong> hoy</div>
    <div class="stat-pill">⏱ <strong>${todayTime}</strong></div>
  `;

  // Task list
  if (state.tasks.length === 0) {
    taskList.innerHTML = '<div class="empty-tasks">No hay tareas. ¡Añade una para empezar!</div>';
    return;
  }

  taskList.innerHTML = state.tasks.map(task => {
    const taskTodayCount = Historial.taskTodayCount(history, task.id, Date.now());
    const taskTodayTime = Historial.deriveTime(taskTodayCount, DURATIONS.pomodoro / 60);
    const taskTodayMeta = taskTodayCount > 0
      ? `
            <div class="task-poms">${'<span class="task-pom-dot"></span>'.repeat(taskTodayCount)}</div>
            <span>${taskTodayCount} hoy · ${taskTodayTime}</span>
        `
      : '';

    return `
      <div class="task-item ${task.id === state.activeTaskId ? 'selected' : ''} ${task.completed ? 'completed' : ''}"
           data-id="${task.id}">
        <div class="task-check" data-action="check" data-id="${task.id}">
          ${task.completed ? '✓' : ''}
        </div>
        <div class="task-info">
          ${task.id === state.editingTaskId
            ? `<input class="task-name-input" data-id="${task.id}" value="${escapeHtml(task.name)}" maxlength="80" />`
            : `<div class="task-name">${escapeHtml(task.name)}</div>`}
          <div class="task-meta">
            ${taskTodayMeta}
          </div>
        </div>
        <button class="task-edit" data-action="edit" data-id="${task.id}" title="Editar">✎</button>
        <button class="task-delete" data-action="delete" data-id="${task.id}" title="Eliminar">✕</button>
      </div>
    `;
  }).join('');

  // Enfocar el input recién renderizado
  if (state.editingTaskId) {
    const input = taskList.querySelector('.task-name-input');
    if (input) { input.focus(); input.select(); }
  }
}

function monthLabel(date) {
  return date.toLocaleDateString('es', { month: 'long', year: 'numeric' });
}

function dateKey(year, month, day) {
  return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

function renderHistoryOverlay() {
  const year = historyOverlayDate.getFullYear();
  const month = historyOverlayDate.getMonth();
  const grid = Historial.monthGrid(history, year, month);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const weekdayNames = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

  historyMonthLabel.textContent = monthLabel(historyOverlayDate);
  historyGrid.innerHTML = weekdayNames
    .map(day => `<div class="history-day-name">${day}</div>`)
    .join('');

  const firstWeekday = new Date(year, month, 1).getDay();
  const leadingBlankDays = (firstWeekday + 6) % 7;
  for (let blank = 0; blank < leadingBlankDays; blank++) {
    historyGrid.innerHTML += '<div class="history-day-spacer" aria-hidden="true"></div>';
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dayStr = dateKey(year, month, day);
    const data = grid.get(dayStr) || { count: 0, intensity: 0 };
    const classes = ['history-day'];
    if (data.count === 0) classes.push('empty');
    if (selectedHistoryDay === dayStr) classes.push('selected');
    historyGrid.innerHTML += `
      <button class="${classes.join(' ')}"
              data-date="${dayStr}"
              data-count="${data.count}"
              style="--intensity: ${data.intensity}">
        ${day}
      </button>
    `;
  }

  renderHistoryDetail();
}

function renderHistoryDetail() {
  if (!selectedHistoryDay) {
    historyDetail.innerHTML = '';
    return;
  }

  const detail = Historial.dayDetail(history, selectedHistoryDay, state.tasks);
  const title = `<div class="history-detail-title">${selectedHistoryDay}</div>`;
  if (detail.length === 0) {
    historyDetail.innerHTML = `${title}<div class="history-detail-empty">Sin pomodoros registrados.</div>`;
    return;
  }

  historyDetail.innerHTML = `
    ${title}
    <div class="history-detail-list">
      ${detail.map(item => `
        <div class="history-detail-row">
          <div class="history-detail-task">${escapeHtml(item.nombre || 'Tarea eliminada')}</div>
          <div class="history-detail-meta">${item.count} pomodoro${item.count === 1 ? '' : 's'} · ${item.tiempo}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function openHistoryOverlay() {
  historyOverlayDate = new Date();
  selectedHistoryDay = null;
  historyOverlay.classList.add('open');
  historyOverlay.setAttribute('aria-hidden', 'false');
  renderHistoryOverlay();
}

function closeHistoryOverlay() {
  historyOverlay.classList.remove('open');
  historyOverlay.setAttribute('aria-hidden', 'true');
}

function changeHistoryMonth(delta) {
  historyOverlayDate = new Date(historyOverlayDate.getFullYear(), historyOverlayDate.getMonth() + delta, 1);
  selectedHistoryDay = null;
  renderHistoryOverlay();
}

// ── Renombrar tarea ──
function commitRename(id, value) {
  if (state.editingTaskId !== id) return;  // ya se resolvió (Escape o commit previo)
  const name = value.trim();
  const task = state.tasks.find(t => t.id === id);
  if (task && name) task.name = name;      // nombre vacío → se descarta el cambio
  state.editingTaskId = null;
  save();
  renderTasks();
}

function cancelRename() {
  state.editingTaskId = null;
  renderTasks();
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

// AudioContext único, mantenido activo con buffers silenciosos para evitar que el navegador lo suspenda
let audioCtx = null;
let keepAliveTimer = null;

function keepAudioAlive() {
  if (!audioCtx || audioCtx.state !== 'running') return;
  // Reproducir un buffer de 1 muestra en silencio para mantener el contexto activo
  const buf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  src.start();
  keepAliveTimer = setTimeout(keepAudioAlive, 10000);
}

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().then(() => {
      clearTimeout(keepAliveTimer);
      keepAudioAlive();
    });
  }
}

// Desbloquear en cuanto el usuario toca algo
document.addEventListener('click', unlockAudio, { once: false });

function playAlarm() {
  try {
    if (!audioCtx || audioCtx.state !== 'running') return;
    scheduleAlarm(audioCtx);
  } catch(e) { /* ignore */ }
}

function scheduleAlarm(ctx) {
  // Patrón: 3 pares de tonos tipo alarma clásica
  const pattern = [880, 660, 880, 660, 880, 660];
  const duration = 0.18;
  const gap = 0.08;
  const pauseBetweenPairs = 0.22;

  pattern.forEach((freq, i) => {
    const pairGap = Math.floor(i / 2) * pauseBetweenPairs;
    const t = ctx.currentTime + 0.05 + i * (duration + gap) + pairGap;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
    gain.gain.setValueAtTime(0.35, t + duration - 0.03);
    gain.gain.linearRampToValueAtTime(0, t + duration);

    osc.start(t);
    osc.stop(t + duration + 0.05);
  });
}

// ── DOM refs ──
const btnStart = document.getElementById('btnStart');
const btnReset = document.getElementById('btnReset');
const btnSkip = document.getElementById('btnSkip');
const btnAddTask = document.getElementById('btnAddTask');
const taskInput = document.getElementById('taskInput');
const taskList = document.getElementById('taskList');
const timerDisplay = document.getElementById('timerDisplay');
const timerLabel = document.getElementById('timerLabel');
const progressCircle = document.getElementById('progressCircle');
const pomodoroCounter = document.getElementById('pomodoroCounter');
const activeTaskName = document.getElementById('activeTaskName');
const toast = document.getElementById('toast');
const statsRow = document.getElementById('statsRow');
const btnHistory = document.getElementById('btnHistory');
const historyOverlay = document.getElementById('historyOverlay');
const btnCloseHistory = document.getElementById('btnCloseHistory');
const btnPrevMonth = document.getElementById('btnPrevMonth');
const btnNextMonth = document.getElementById('btnNextMonth');
const historyMonthLabel = document.getElementById('historyMonthLabel');
const historyGrid = document.getElementById('historyGrid');
const historyDetail = document.getElementById('historyDetail');

// ── Event listeners ──
btnStart.addEventListener('click', () => {
  if (state.running) pauseTimer(); else startTimer();
});

btnReset.addEventListener('click', resetTimer);
btnSkip.addEventListener('click', skipTimer);
btnHistory.addEventListener('click', openHistoryOverlay);
btnCloseHistory.addEventListener('click', closeHistoryOverlay);
btnPrevMonth.addEventListener('click', () => changeHistoryMonth(-1));
btnNextMonth.addEventListener('click', () => changeHistoryMonth(1));

historyGrid.addEventListener('click', e => {
  const date = e.target.dataset.date;
  if (!date) return;
  selectedHistoryDay = date;
  renderHistoryOverlay();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeHistoryOverlay();
});

document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.addEventListener('click', () => switchMode(tab.dataset.mode));
});

function addTask() {
  const name = taskInput.value.trim();
  if (!name) return;
  const task = createTask(name);
  state.tasks.unshift(task);
  taskInput.value = '';
  // Auto-select if no active task
  if (!state.activeTaskId) state.activeTaskId = task.id;
  save();
  renderTasks();
}

btnAddTask.addEventListener('click', addTask);
taskInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

taskList.addEventListener('click', e => {
  const action = e.target.dataset.action;
  const id = e.target.dataset.id;

  // No robar el foco del input mientras se renombra
  if (e.target.classList.contains('task-name-input')) {
    e.stopPropagation();
    return;
  }

  if (action === 'edit') {
    e.stopPropagation();
    state.editingTaskId = id;
    renderTasks();
    return;
  }

  if (action === 'delete') {
    e.stopPropagation();
    if (Historial.hasPomodoros(history, id)) {
      const count = Historial.taskAllTimeCount(history, id);
      showToast(`Esta tarea tiene ${count} pomodoro${count === 1 ? '' : 's'} registrado${count === 1 ? '' : 's'} y no puede borrarse.`);
      return;
    }
    state.tasks = state.tasks.filter(t => t.id !== id);
    if (state.activeTaskId === id) state.activeTaskId = null;
    save();
    renderTasks();
    return;
  }

  if (action === 'check') {
    e.stopPropagation();
    const task = state.tasks.find(t => t.id === id);
    if (task) {
      task.completed = !task.completed;
      if (task.completed && state.activeTaskId === id) {
        if (state.running) {
          resetTimer();
          showToast('Pomodoro abandonado por tarea completada.');
        }
        state.activeTaskId = null;
      }
      save();
      renderTasks();
    }
    return;
  }

  // Click on task item → select as active
  const item = e.target.closest('.task-item');
  if (item) {
    const taskId = item.dataset.id;
    const task = state.tasks.find(t => t.id === taskId);
    if (task && !task.completed) {
      if (state.running && state.activeTaskId !== taskId) {
        resetTimer();
        showToast('Pomodoro abandonado por cambio de tarea.');
      }
      state.activeTaskId = taskId;
      save();
      renderTasks();
    }
  }
});

// Enter confirma, Escape cancela, perder el foco confirma
taskList.addEventListener('keydown', e => {
  if (!e.target.classList.contains('task-name-input')) return;
  if (e.key === 'Enter') { e.preventDefault(); commitRename(e.target.dataset.id, e.target.value); }
  if (e.key === 'Escape') { e.preventDefault(); cancelRename(); }
});

taskList.addEventListener('focusout', e => {
  if (!e.target.classList.contains('task-name-input')) return;
  commitRename(e.target.dataset.id, e.target.value);
});

// ── Init ──
load();
updateModeUI();
updateUI();
renderCounter();
renderTasks();
</script>
