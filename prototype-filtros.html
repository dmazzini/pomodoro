<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>PROTOTIPO — La sección de filtros</title>
<!--
  PROTOTIPO DESECHABLE — dónde vive la sección de filtros y qué forma tiene (issue #37, mapa #32).

  Cuatro variantes de UNA sola superficie nueva, montadas dentro de la app real (mismo
  chrome, misma densidad, ventana de 640x820), conmutables con `?variant=` y con la barra
  flotante de abajo, o con las flechas <- ->.

  Lo que se está preguntando (las 7 del ticket):
    1. ¿Dónde vive?                 (bajo las pestañas / bajo las pestañas / en el propio
                                     campo de añadir / en la cabecera del panel)
    2. ¿Siempre visible o desplegable?
    3. ¿Cómo se elige la etiqueta?  (desplegable / chips de todas / tira que se desplaza / lista)
    4. ¿Convive con el campo de «añadir tarea»?
    5. ¿Cómo se ve que hay filtro puesto y cómo se quita? (¿sobrevive el aviso?)
    6. ¿Y la lista vacía?
    7. ¿Y en la pestaña de archivadas?

  Cada variante es un PAQUETE COHERENTE, no una lista de opciones sueltas.

  LO QUE YA ESTÁ DECIDIDO y el prototipo respeta a rajatabla (todo de #36, cerrado):
    - Dos criterios, combinados con Y. Un criterio sin poner NO restringe.
    - El texto sólo de espacios cuenta como no puesto (se recorta antes de comparar).
    - Coincidencia por SUBCADENA en cualquier posición, insensible a mayúsculas y a
      acentos (NFD + quitar diacríticos), A CADA TECLA. `ano` encuentra «año», aceptado.
    - Una etiqueta a la vez: pulsar otra CAMBIA el filtro, no lo suma.
    - Los chips de la fila son RÓTULO INERTE — no filtran, no abren el popover, no eligen
      `tarea activa`. El clic se consume. La sección es la ÚNICA entrada al filtro.
    - El aviso: UNA sola cuenta de ocultas sobre los dos criterios, UNA sola acción que
      limpia los dos. (Su REDACCIÓN y su SITIO son justo lo que decide este ticket.)
    - Con cualquier filtro puesto no se puede reordenar: el asa se atenúa.
    - Crear una tarea limpia LOS DOS criterios, diciéndolo.
    - Renombrar fuera del filtro saca la fila EN SILENCIO; la cuenta de ocultas sube.
    - Nada se persiste; al arrancar no hay filtro. Cambiar de pestaña limpia los dos.
    - Filtrar en `Archivadas` está FUERA DE ALCANCE.

  LO QUE ESTE PROTOTIPO NO DECIDE: nada del modelo del filtro (es de #36) ni el popover de
  etiquetas (🏷 abre un stub que sólo dice que existe: su forma la cerró #25).

  Ninguna escritura: no toca localStorage. Los datos van sembrados en memoria, así que
  mirar esto no puede estropear las tareas reales.
-->
<style>

  .btn { border: none; border-radius: 50px; font-weight: 700; cursor: pointer; transition: all 0.15s; }

  .timer-card {

  }

<script>
/* ═══════════════════════════════════════════════════════════════════
   Las cuatro variantes — cada una es un PAQUETE coherente.

   Los cuatro ejes en los que se contradicen a propósito:
     dónde · cuánto alto cuesta en reposo · cómo se elige la etiqueta · quién
     lleva el aviso de «N ocultas» (la sección misma o el banner de #25)
   ═══════════════════════════════════════════════════════════════════ */

const VARIANTES = [
  {
    key: 'A', nombre: 'La barra siempre puesta',
    donde: 'bajo las pestañas, sobre el campo de añadir',
    plegable: false,
    elegir: 'desplegable',
    aviso: 'en la sección',        // la barra lleva la cuenta y la ✕; el banner desaparece
    archivadas: 'desaparece',
    resumen: 'barra fija de 1 línea · etiqueta por desplegable · el aviso va dentro · sin banner',
  },
  {
    key: 'B', nombre: 'El cajón',
    donde: 'bajo las pestañas, sobre el campo de añadir',
    plegable: true,
    elegir: 'chips',
    aviso: 'en la sección',        // la tira plegada lleva el resumen y la cuenta
    archivadas: 'desaparece',
    resumen: 'tira plegable · todas las etiquetas como chips · plegado dice qué filtras · sin banner',
  },
  {
    key: 'C', nombre: 'Un campo, dos modos',
    donde: 'dentro del propio campo de «añadir tarea»',
    plegable: true,
    elegir: 'tira',

let vKey = new URLSearchParams(location.search).get('variant');
if (!VARIANTES.some(v => v.key === (vKey || '').toUpperCase())) vKey = 'A';
vKey = vKey.toUpperCase();

let activeTab = 'tareas';
let filtroEtiqueta = null;     // id o null — UNA a la vez (#25, #36)
let filtroNombre = '';         // cadena; '' = no puesto (#36)
let activeTaskId = null;
let menuAbierto = false;       // A: desplegable de etiquetas
let cajonAbierto = false;      // B: cajón desplegado
let modoFiltro = false;        // C: el campo está en modo filtrar
let popAbierto = false;        // D: popover de la cabecera
let seq = 100;
const costeReposo = {};        // px que cuesta cada variante en reposo, medido en vivo

function V() { return VARIANTES.find(v => v.key === vKey); }

/* ═══════════════════════════════════════════════════════════════════
   Reglas del filtro — TODAS cerradas por #36, aquí sólo se obedecen
   ═══════════════════════════════════════════════════════════════════ */

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function et(id) { return etiquetas.find(e => e.id === id); }

/* #36 §2 — insensible a mayúsculas y a acentos. `ñ` vale como `n`, aceptado a sabiendas. */
function norm(s) {
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}

/* #36 §1 — Y entre criterios; un criterio sin poner NO restringe.
   El texto de sólo espacios cuenta como no puesto. */
function textoPuesto() { return filtroNombre.trim() !== ''; }
function hayFiltro() { return filtroEtiqueta !== null || textoPuesto(); }

function pasaFiltro(t) {
  if (filtroEtiqueta !== null && !t.etiquetaIds.includes(filtroEtiqueta)) return false;
  if (textoPuesto() && !norm(t.name).includes(norm(filtroNombre.trim()))) return false;
  return true;
}

function listaTrabajo() { return tasks.filter(t => !t.archived); }
function listaArchivadas() { return tasks.filter(t => t.archived); }
function visibles() {
  return activeTab === 'archivadas' ? listaArchivadas() : listaTrabajo().filter(pasaFiltro);
}
function ocultas() {
  return activeTab === 'archivadas' ? 0 : listaTrabajo().length - listaTrabajo().filter(pasaFiltro).length;
}
function cuantasCon(etId) { return listaTrabajo().filter(t => t.etiquetaIds.includes(etId)).length; }

/* #36 §1 — pulsar otra etiqueta CAMBIA el filtro, no lo suma */
function elegirEtiqueta(id) {
  filtroEtiqueta = (filtroEtiqueta === id) ? null : id;
  render();
}
/* #36 §4 — una sola acción que limpia LOS DOS */
function quitarFiltro() {
  filtroEtiqueta = null; filtroNombre = ''; render();
}

/* ═══════════════════════════════════════════════════════════════════
   La sección de filtros — lo ÚNICO que cambia entre variantes
   ═══════════════════════════════════════════════════════════════════ */

function renderSeccion() {
  const v = V();
  const sec = document.getElementById('seccionFiltro');
  const antes = document.getElementById('antesDeTabs');
  const addZone = document.getElementById('addZone');
  const bajo = document.getElementById('seccionFiltroBajo');
  const header = document.getElementById('panelHeader');
  sec.innerHTML = ''; antes.innerHTML = ''; bajo.innerHTML = '';

  /* cabecera — D mete ahí su botón; las demás, la cabecera de siempre */
  const stats = `
    <div class="stats-row">
      <div class="stat-pill">✅ <strong>${listaTrabajo().filter(t => t.completed).length}/${listaTrabajo().length}</strong> tareas</div>
      <div class="stat-pill">🍅 <strong>7</strong> hoy</div>
    </div>`;
  if (v.key === 'D') {
    const enArchivadas = activeTab === 'archivadas';
    header.innerHTML = `
      <span class="panel-title">Tareas</span>
      <div class="panel-header-right">
        <button class="fd-btn ${hayFiltro() ? 'puesto' : ''}" data-accion="pop"
                ${enArchivadas ? 'disabled style="opacity:0.35;cursor:not-allowed"' : ''}
                title="${enArchivadas ? 'No se filtra en Archivadas' : 'Filtrar'}">🔍${hayFiltro() ? ' ●' : ''}</button>
        ${stats}
      </div>
      ${popAbierto && !enArchivadas ? renderPopD() : ''}`;
  } else {
    header.innerHTML = `<span class="panel-title">Tareas</span>${stats}`;
  }

  /* el campo de añadir — C lo reescribe entero */
  if (activeTab === 'archivadas') {
    addZone.innerHTML = '';
  } else if (v.key === 'C') {
    addZone.innerHTML = `
      <div class="add-task-form fc-form">
        <input type="text" id="campoUnico" maxlength="80"
               class="${modoFiltro ? 'filtrando' : ''}"
               placeholder="${modoFiltro ? 'Filtrar por nombre…' : 'Añadir nueva tarea...'}"
               value="${modoFiltro ? esc(filtroNombre) : ''}" />
        <button class="fc-toggle ${modoFiltro ? 'activo' : ''}" data-accion="modo" title="${modoFiltro ? 'Salir del filtro' : 'Filtrar'}">${modoFiltro ? '✕' : '🔍'}</button>
        ${modoFiltro ? '' : '<button class="btn btn-add" data-accion="crear">+</button>'}
      </div>`;
  } else {
    addZone.innerHTML = `
      <div class="add-task-form">
        <input type="text" id="taskInput" placeholder="Añadir nueva tarea..." maxlength="80" />
        <button class="btn btn-add" data-accion="crear">+</button>
      </div>`;
  }

  /* la sección propiamente dicha */
  if (activeTab === 'archivadas') return;   // A, B y C: desaparece. D ya se deshabilitó arriba.

  if (v.key === 'A') sec.innerHTML = renderA();
  if (v.key === 'B') sec.innerHTML = cajonAbierto ? renderBAbierto() : renderBPlegado();
  /* C: la tira va DEBAJO del campo — el campo se convierte en el de filtrar y las
     etiquetas salen con él, no antes que él */
  if (v.key === 'C') bajo.innerHTML = modoFiltro ? renderCTira() : '';
}

/* ── A — la barra siempre puesta ─────────────────────────────────── */
function renderA() {
  const e = filtroEtiqueta !== null ? et(filtroEtiqueta) : null;
  const n = ocultas();
  return `
    <div class="fa-bar ${hayFiltro() ? 'puesto' : ''}" style="position:relative">
      <span class="fa-lupa">🔍</span>
      <input type="text" id="campoNombre" placeholder="Filtrar por nombre…" value="${esc(filtroNombre)}" maxlength="80" />
      <button class="fa-tag-btn" data-accion="menu">
        ${e ? `<span class="punto" style="background:${e.color}"></span><span class="nom">${esc(e.nombre)}</span>` : '<span class="nom">Etiqueta</span>'}
        <span>▾</span>
      </button>
      ${hayFiltro() ? `<span class="fa-ocultas">${n} ${n === 1 ? 'oculta' : 'ocultas'}</span>
                       <button class="fa-x" data-accion="quitar" title="Quitar el filtro">✕</button>` : ''}
      ${menuAbierto ? renderMenuA() : ''}
    </div>`;
}
function renderMenuA() {
  return `<div class="fa-menu" style="right:0; top:44px;">
    ${filtroEtiqueta !== null ? '<button data-accion="et" data-id="">— Ninguna —</button>' : ''}
    ${etiquetas.map(e => `
      <button class="${filtroEtiqueta === e.id ? 'sel' : ''}" data-accion="et" data-id="${e.id}">
        <span class="punto" style="background:${e.color}"></span>${esc(e.nombre)}
        <span class="cuenta">${cuantasCon(e.id)}</span>
      </button>`).join('')}

}

/* ── B — el cajón ────────────────────────────────────────────────── */
function renderBPlegado() {
  const e = filtroEtiqueta !== null ? et(filtroEtiqueta) : null;
  const n = ocultas();
  if (!hayFiltro()) {
    return `<button class="fb-strip" data-accion="cajon">
      <span class="resumen">🔍 Filtrar</span><span class="caret">▾</span></button>`;
  }
  return `<button class="fb-strip puesto" data-accion="cajon">
    <span class="resumen">🔍
      ${e ? `<span class="fb-chip-inline" style="background:${e.color}">${esc(e.nombre)}</span>` : ''}
      ${textoPuesto() ? `<span class="fb-comilla">«${esc(filtroNombre.trim())}»</span>` : ''}
      <span style="color:var(--text-muted)">· ${n} ${n === 1 ? 'oculta' : 'ocultas'}</span>
    </span>
    <span class="caret" data-accion="quitar" title="Quitar el filtro">✕</span>
    <span class="caret">▾</span></button>`;
}
function renderBAbierto() {
  const n = ocultas();
  return `<div class="fb-cajon">
    <div class="fila1">
      <input type="text" id="campoNombre" placeholder="Filtrar por nombre…" value="${esc(filtroNombre)}" maxlength="80" />
      <button class="fb-cerrar" data-accion="cajon" title="Plegar">▴</button>
    </div>
    <div class="fb-chips">
      ${etiquetas.map(e => `
        <button class="${filtroEtiqueta === e.id ? 'sel' : ''}" data-accion="et" data-id="${e.id}"

    </div>
    ${hayFiltro() ? `<div class="fb-pie">
      <span class="cuenta">${n} ${n === 1 ? 'tarea oculta' : 'tareas ocultas'}</span>
      <button class="filter-clear" data-accion="quitar">Quitar filtro</button></div>` : ''}

}

/* ── C — la tira de etiquetas, sólo en modo filtrar ──────────────── */
function renderCTira() {
  return `<div class="fc-tira">
    ${etiquetas.map(e => `
      <button class="${filtroEtiqueta === e.id ? 'sel' : ''}" data-accion="et" data-id="${e.id}"
              style="background:${e.color}">${esc(e.nombre)}</button>`).join('')}

}

/* ── D — el popover de la cabecera ──────────────────────────────── */
function renderPopD() {
  const n = ocultas();
  return `<div class="fd-pop">
    <input type="text" id="campoNombre" placeholder="Filtrar por nombre…" value="${esc(filtroNombre)}" maxlength="80" />
    <div class="fd-lista">
      ${etiquetas.map(e => `
        <button class="${filtroEtiqueta === e.id ? 'sel' : ''}" data-accion="et" data-id="${e.id}">

}

/* ═══════════════════════════════════════════════════════════════════
   El aviso de #25 — sólo en las variantes que NO lo absorben
   ═══════════════════════════════════════════════════════════════════ */

function renderBanner() {
  const b = document.getElementById('filterBanner');
  const v = V();
  if (v.aviso !== 'banner' || activeTab === 'archivadas' || !hayFiltro()) {
    b.className = 'filter-banner'; b.innerHTML = ''; return;
  }
  const n = ocultas();
  b.innerHTML = `
    <span class="filter-hidden-count">Filtrando · ${n} ${n === 1 ? 'tarea oculta' : 'tareas ocultas'}</span>
    <button class="filter-clear" data-accion="quitar">Quitar filtro</button>`;
  b.className = 'filter-banner open';
}

/* ═══════════════════════════════════════════════════════════════════
   El resto de la app — idéntico en las cuatro
   ═══════════════════════════════════════════════════════════════════ */

function renderTabs() {
  document.getElementById('taskTabs').innerHTML = `
    <button class="task-tab ${activeTab === 'tareas' ? 'active' : ''}" data-accion="tab" data-tab="tareas">Tareas ${listaTrabajo().length}</button>
    <button class="task-tab ${activeTab === 'archivadas' ? 'active' : ''}" data-accion="tab" data-tab="archivadas">Archivadas ${listaArchivadas().length}</button>`;
}

function renderLista() {
  const lista = document.getElementById('taskList');
  const vis = visibles();

  if (activeTab === 'archivadas' && vis.length === 0) {
    lista.innerHTML = '<div class="empty-tasks">No hay tareas archivadas.</div>'; return;
  }
  /* #36 §10 — la lista vacía por filtro es un estado ORDINARIO: mensaje genérico,
     sin nombrar el texto (ya está a la vista en el cuadro donde lo escribiste). */
  if (activeTab === 'tareas' && hayFiltro() && vis.length === 0) {
    lista.innerHTML = `<div class="empty-tasks">No hay tareas visibles con este filtro.
      <button class="filter-clear" data-accion="quitar">Quitar filtro</button></div>`;
    return;
  }
  if (activeTab === 'tareas' && listaTrabajo().length === 0) {
    lista.innerHTML = '<div class="empty-tasks">No hay tareas en la lista de trabajo. Mira en Archivadas.</div>'; return;
  }

  /* #36 §5 — con cualquier filtro puesto no se reordena */
  const congelado = activeTab === 'tareas' && hayFiltro();

  lista.innerHTML = vis.map(t => {
    const ets = t.etiquetaIds.map(et).filter(Boolean);
    const vist = ets.slice(0, 2);
    const chips = vist.map(e => `<span class="etiqueta-chip" style="background:${e.color}" title="${esc(e.nombre)}"><span>${esc(e.nombre)}</span></span>`);
    if (ets.length > 2) chips.push(`<span class="etiqueta-chip" style="background:${ets[2].color}">+${ets.length - 2}</span>`);
    return `
      <div class="task-item ${activeTaskId === t.id ? 'selected' : ''}" data-accion="fila" data-id="${t.id}">
        <span class="task-handle ${congelado ? 'disabled' : ''}" title="${congelado ? 'No se puede reordenar con un filtro activo' : 'Arrastrar'}">⠿</span>
        <span class="task-check"></span>
        <div class="task-info">
          <div class="task-name">${esc(t.name)}</div>
          <div class="task-meta">
            ${t.poms ? `<span class="task-poms">${'<span class="task-pom-dot"></span>'.repeat(Math.min(t.poms, 6))}</span><span>${t.poms * 25} min hoy</span>` : '<span>Sin pomodoros hoy</span>'}
            ${chips.length ? `<div class="task-chips">${chips.join('')}</div>` : ''}
          </div>
        </div>
        <button class="task-etiquetas" data-accion="popover-et" title="Etiquetas">🏷</button>
        <button class="task-ficha" data-accion="ficha" title="Ver ficha">ⓘ</button>
      </div>`;
  }).join('');
}

function render() {
  renderTabs();
  renderSeccion();
  renderBanner();
  renderLista();
  document.getElementById('activeName').textContent =
    activeTaskId ? (tasks.find(t => t.id === activeTaskId) || {}).name : '— Ninguna tarea seleccionada —';
  medirCoste();
  renderProtoBar();
}

/* ═══════════════════════════════════════════════════════════════════
   La medida que el ticket pide: cuánto alto cuesta cada variante
   ═══════════════════════════════════════════════════════════════════ */

/* El alto que la sección le quita a la lista. D vive en una superposición, así que no
   le quita nada; C sólo cuesta la tira, porque el campo ya estaba ahí para añadir. */
function altoSeccion() {
  const v = V();
  if (v.key === 'D') return 0;
  if (v.key === 'C') return document.getElementById('seccionFiltroBajo').offsetHeight;
  return document.getElementById('seccionFiltro').offsetHeight;
}
function medirCoste() {
  if (!hayFiltro() && !cajonAbierto && !modoFiltro && !popAbierto && activeTab === 'tareas') {
    costeReposo[vKey] = altoSeccion();
  }
}
function filasQueCaben() {
  const lista = document.getElementById('taskList');
  const top = lista.getBoundingClientRect().top;
  return Math.max(0, Math.floor((window.innerHeight - 150 - top) / 74));
}

/* abre la superficie si la variante la tiene plegada, para que el caso se vea */
function abrirSiHaceFalta() {
  const v = V();
  if (v.key === 'B') cajonAbierto = true;
  if (v.key === 'C') modoFiltro = true;
  render();
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 5200);
}

/* ═══════════════════════════════════════════════════════════════════
   La barra del prototipo
   ═══════════════════════════════════════════════════════════════════ */

function renderProtoBar() {
  const v = V();
  const reposo = costeReposo[vKey];
  document.getElementById('protoBar').innerHTML = `
    <div class="linea">
      <span class="nav"><button data-nav="-1">←</button></span>
      <span class="clave">${v.key}</span>
      <span class="quien">${v.nombre}</span>
      <span class="que">${v.resumen}</span>
      <span class="nav"><button data-nav="1">→</button></span>
    </div>
    <div class="linea">
      <span class="coste">
        <span>alto que cuesta:</span>
        <span>en reposo <span class="n">${reposo === undefined ? '—' : reposo}</span>px</span>
        <span>· ahora <span class="n">${altoSeccion()}</span>px</span>
        <span>· caben <span class="n">${filasQueCaben()}</span> filas</span>
      </span>
    </div>
    <div class="casos">${CASOS.map((c, i) => `<button data-caso="${i}">${c[0]}</button>`).join('')}</div>`;
}

function setVariante(k) {
  vKey = k;
  const u = new URL(location.href);
  u.searchParams.set('variant', k);
  history.replaceState(null, '', u);
  menuAbierto = false; cajonAbierto = false; modoFiltro = false; popAbierto = false;
  render();
}

/* ═══════════════════════════════════════════════════════════════════
   Eventos — un solo delegado
   ═══════════════════════════════════════════════════════════════════ */

document.addEventListener('click', ev => {
  const nav = ev.target.closest('[data-nav]');
  if (nav) {
    const i = VARIANTES.findIndex(v => v.key === vKey);
    setVariante(VARIANTES[(i + Number(nav.dataset.nav) + VARIANTES.length) % VARIANTES.length].key);
    return;
  }
  const caso = ev.target.closest('[data-caso]');
  if (caso) { CASOS[Number(caso.dataset.caso)][1](); return; }

  const el = ev.target.closest('[data-accion]');
  const accion = el && el.dataset.accion;

  /* cerrar las superposiciones al pulsar fuera */
  if (menuAbierto && !ev.target.closest('.fa-bar')) { menuAbierto = false; render(); if (!accion) return; }
  if (popAbierto && !ev.target.closest('.panel-header')) { popAbierto = false; render(); if (!accion) return; }
  if (!accion) return;

  if (accion === 'quitar')  { ev.stopPropagation(); quitarFiltro(); return; }
  if (accion === 'menu')    { menuAbierto = !menuAbierto; render(); return; }
  if (accion === 'pop')     { popAbierto = !popAbierto; render(); return; }
  if (accion === 'cajon')   { cajonAbierto = !cajonAbierto; render(); return; }
  if (accion === 'modo')    {
    modoFiltro = !modoFiltro;
    if (!modoFiltro) { filtroEtiqueta = null; filtroNombre = ''; }   // salir del modo quita el filtro
    render();
    const c = document.getElementById('campoUnico'); if (c && modoFiltro) c.focus();
    return;
  }
  if (accion === 'et') {
    const id = el.dataset.id;
    filtroEtiqueta = id === '' ? null : (filtroEtiqueta === id ? null : id);
    if (V().key === 'A') menuAbierto = false;
    render();
    return;
  }
  if (accion === 'tab') {
    activeTab = el.dataset.tab;
    filtroEtiqueta = null; filtroNombre = '';        // #36 §9
    cajonAbierto = false; modoFiltro = false; popAbierto = false;
    render();
    return;
  }
  if (accion === 'crear') {
    const inp = document.getElementById('taskInput') || document.getElementById('campoUnico');
    const nombre = (inp && inp.value.trim()) || 'Tarea nueva';
    tasks.push({ id: ++seq, name: nombre, etiquetaIds: [], poms: 0, archived: false, completed: false });
    const habia = hayFiltro();
    filtroEtiqueta = null; filtroNombre = '';        // #36 §6
    render();
    if (habia) toast(`Se quitó el filtro para que «${nombre}» se vea`);
    return;
  }
  if (accion === 'fila')       { activeTaskId = Number(el.dataset.id); render(); return; }
  if (accion === 'popover-et') { ev.stopPropagation(); toast('El popover de etiquetas (🏷) — su forma la cerró #25. Aquí no se dibuja: este ticket va del filtro.'); return; }
  if (accion === 'ficha')      { ev.stopPropagation(); toast('La ficha de la tarea (#21, #27). Aquí no se dibuja.'); return; }
});

/* filtrar A CADA TECLA (#36 §2) — sin repintar el campo, para no perder el cursor */
document.addEventListener('input', ev => {
  if (ev.target.id !== 'campoNombre' && ev.target.id !== 'campoUnico') return;
  if (ev.target.id === 'campoUnico' && !modoFiltro) return;
  filtroNombre = ev.target.value;
  const foco = ev.target.id;
  const pos = ev.target.selectionStart;
  render();
  const nuevo = document.getElementById(foco);
  if (nuevo) { nuevo.focus(); try { nuevo.setSelectionRange(pos, pos); } catch (e) {} }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (menuAbierto)  { menuAbierto = false; render(); return; }
    if (popAbierto)   { popAbierto = false; render(); return; }
    if (cajonAbierto) { cajonAbierto = false; render(); return; }
    if (modoFiltro)   { modoFiltro = false; filtroEtiqueta = null; filtroNombre = ''; render(); return; }
  }
  if (ev.key === 'Enter' && ev.target.id === 'taskInput') {
    document.querySelector('[data-accion="crear"]').click();
    return;
  }
  const tecleando = ['INPUT', 'TEXTAREA'].includes(ev.target.tagName);
  if (!tecleando && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
    const i = VARIANTES.findIndex(v => v.key === vKey);
    setVariante(VARIANTES[(i + (ev.key === 'ArrowRight' ? 1 : -1) + VARIANTES.length) % VARIANTES.length].key);
  }
});

render();
</script>
</body>
</html>
